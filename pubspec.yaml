name: q_master
description: "Unofficial app of f3nation.com."
publish_to: 'none'
version: 2.0.2+435

environment:
  sdk: ^3.10.0

dependencies: # keep sorted alphabetically
  audio_session: ^0.2.2
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.2
  dots_indicator: ^4.0.1
  firebase_ai: ^3.10.0
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_platform_widgets: ^9.0.0
  flutter_riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  intl: any
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  logger: ^2.6.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  pull_down_button: ^0.10.2
  rename: ^3.1.0
  riverpod_annotation: ^4.0.0
  riverpod_generator: ^4.0.0+1
  shake: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
  wakelock_plus: ^1.4.0
  watch_connectivity: ^0.2.6
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.11


dev_dependencies: # keep sorted alphabetically
  build_runner: ^2.10.4
  custom_lint: ^0.8.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_lint: ^3.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios_dark_transparent: "assets/icon/app_icon_dark.png"
  adaptive_icon_foreground: #ffffff
  adaptive_icon_background: "assets/icon/app_icon_dark.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/images/
    - assets/sounds/
  fonts:
    - family: RobotoCondensed-VariableFont_wght
      fonts:
        - asset: assets/fonts/RobotoCondensed-VariableFont_wght.ttf
  shaders:
    - shaders/dodecahedron.frag


