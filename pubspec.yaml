name: q_master
description: "Unofficial app of f3nation.com."
publish_to: 'none'
version: 0.1.1+231

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0
  cupertino_icons: ^1.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_platform_widgets: ^9.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_riverpod: ^3.0.3
  path_provider: ^2.1.5
  wakelock_plus: ^1.4.0
  riverpod_annotation: ^4.0.0
  riverpod_generator: ^4.0.0+1
  share_plus: ^12.0.1
  pull_down_button: ^0.10.2
  rename: ^3.1.0
  shared_preferences: ^2.5.4
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  webview_flutter_android: ^4.10.11
  auto_size_text: ^3.0.0
  package_info_plus: ^9.0.0
  shake: ^3.0.0
  just_audio: ^0.10.5
  audio_session: ^0.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios_dark_transparent: "assets/icon/app_icon_dark.png"
  adaptive_icon_foreground: #ffffff
  adaptive_icon_background: "assets/icon/app_icon_dark.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/sounds/
  shaders:
    - shaders/dodecahedron.frag

