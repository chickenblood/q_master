name: q_master
description: "Unofficial app of f3nation.com."
publish_to: 'none'
version: 3.4.1+508

environment:
  sdk: ^3.10.0

dependencies: # keep sorted alphabetically
  audio_session: ^0.2.2
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.2
  dots_indicator: ^4.0.1
  firebase_ai: ^3.12.2
  firebase_core: ^4.10.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_platform_widgets: ^9.0.0
  flutter_riverpod: ^3.0.3
  flutter_widget_from_html_core: ^0.17.2
  freezed_annotation: ^3.1.0
  intl: any
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  logger: ^2.6.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  pull_down_button: ^0.10.2
  riverpod_annotation: ^4.0.0
  shake: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  speech_to_text: ^7.3.0
  stupid_simple_sheet: ^0.9.1+1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.4.0
  watch_connectivity: ^0.2.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.11
  youtube_player_flutter: ^9.1.3


# flutter_inappwebview_android 1.1.3 uses proguard-android.txt which AGP 9 no longer supports.
# Override to 1.2.0-beta.3 which uses proguard-android-optimize.txt.
# Remove once youtube_player_flutter upgrades its flutter_inappwebview dependency.
dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3
  flutter_inappwebview_android: 1.2.0-beta.3
  flutter_inappwebview_ios: 1.2.0-beta.3
  flutter_inappwebview_macos: 1.2.0-beta.3
  flutter_inappwebview_platform_interface: 1.4.0-beta.3
  flutter_inappwebview_web: 1.2.0-beta.3
  flutter_inappwebview_windows: 0.7.0-beta.3

dev_dependencies: # keep sorted alphabetically
  build_runner: ^2.10.4
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios_dark_transparent: "assets/icon/app_icon_dark.png"
  adaptive_icon_foreground: #ffffff
  adaptive_icon_background: "assets/icon/app_icon_dark.png"
  min_sdk_android: 21

flutter:
  config:
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/images/
    - assets/sounds/
  fonts:
    - family: RobotoCondensed-VariableFont_wght
      fonts:
        - asset: assets/fonts/RobotoCondensed-VariableFont_wght.ttf
  shaders:
    - shaders/dodecahedron.frag


