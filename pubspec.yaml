name: q_master
description: "Unofficial app of f3nation.com."
publish_to: 'none'
version: 3.5.1+641

environment:
  sdk: ^3.10.0

dependencies: # keep sorted alphabetically
  accessing_security_scoped_resource: ^3.5.0
  audio_session: ^0.2.4
  auto_size_text: ^3.0.0
  cloud_functions: ^6.5.0
  cupertino_icons: ^1.0.2
  dots_indicator: ^5.0.0
  firebase_ai: ^4.0.0
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_platform_widgets: ^10.0.1
  flutter_riverpod: ^3.0.3
  flutter_widget_from_html_core: ^0.17.2
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: any
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  liquid_glass_widgets: ^1.8.1
  logger: ^2.6.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  riverpod: ^3.0.1
  riverpod_annotation: ^4.0.0
  shake: ^3.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  speech_to_text: ^7.4.0
  stupid_simple_sheet: ^0.9.1+1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.5.2
  watch_connectivity: ^0.2.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.11
  youtube_player_iframe: ^6.0.2
  zikzak_share_handler: ^1.0.1

dev_dependencies: # keep sorted alphabetically
  build_runner: ^2.10.4
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios_dark_transparent: "assets/icon/app_icon_dark.png"
  adaptive_icon_foreground: #ffffff
  adaptive_icon_background: "assets/icon/app_icon_dark.png"
  min_sdk_android: 21

flutter:
  config:
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/images/
    - assets/sounds/
  fonts:
    - family: RobotoCondensed-VariableFont_wght
      fonts:
        - asset: assets/fonts/RobotoCondensed-VariableFont_wght.ttf
    - family: Menu
      fonts:
        - asset: assets/fonts/Menu.ttf
  shaders:
    - shaders/dodecahedron.frag


