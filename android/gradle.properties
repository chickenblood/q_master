org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The legacy variant API is disabled by default in AGP 9.0.
# We must re-enable it for older Flutter plugins to avoid 'applicationVariants' errors.
android.newDsl=false

# AGP 9.0+ has built-in Kotlin support and forbids applying the Kotlin plugin manually.
# However, older Flutter SDKs (like 3.2.1) have a bug where they NPE if it's missing.
# We opt-out of built-in Kotlin to allow manual application until Flutter is upgraded.
android.builtInKotlin=false
